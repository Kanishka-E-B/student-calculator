<!DOCTYPE html>
<html> 
    <head>
        <title>Student Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="box">
            <h1>Student Calculator</h1>
            <p>Enter Your Marks(out of 100)</p>
            <input type="number" id="m1"placeholder="subject1">
            <input type="number" id="m2"placeholder="subject2">
            <input type="number" id="m3"placeholder="subject3">
            <input type="number" id="m4"placeholder="subject4">
            <input type="number" id="m5"placeholder="subject5">
            <button onclick="calculate()">Calculate Result</button>
            <h2 id="result"></h2>
            <p id="grade"></p>

        </div>
            <script src="script.js"></script>
    </body>
</html>
